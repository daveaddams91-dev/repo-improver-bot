name: Mistral key test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Call Mistral API
        env:
          MISTRAL_KEY: ${{ secrets.LLM3_API_KEY }}
        run: |
          python3 - << 'EOF'
          import json, urllib.request, urllib.error
          req = urllib.request.Request(
              "https://api.mistral.ai/v1/chat/completions",
              data=json.dumps({"model": "mistral-large-latest",
                               "messages": [{"role": "user", "content": "Reply with exactly: OK"}],
                               "max_tokens": 10}).encode(),
              method="POST",
              headers={"Authorization": "Bearer " + __import__("os").environ["MISTRAL_KEY"],
                       "Content-Type": "application/json"})
          try:
              d = json.loads(urllib.request.urlopen(req, timeout=60).read())
              print("MISTRAL_TEST_RESULT: SUCCESS via", d.get("model"))
              print("MISTRAL_TEST_REPLY:", d["choices"][0]["message"]["content"][:50])
          except urllib.error.HTTPError as e:
              print("MISTRAL_TEST_RESULT: FAILED HTTP", e.code)
              print(e.read().decode()[:300])
          EOF
