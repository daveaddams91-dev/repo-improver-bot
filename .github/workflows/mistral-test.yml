name: Mistral key test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Mistral API
        env:
          MISTRAL_KEY: ${{ secrets.LLM3_API_KEY }}
        run: |
          python3 - << 'EOF'
          import json, os, urllib.request, urllib.error
          KEY = os.environ["MISTRAL_KEY"]
          def call(path, payload=None):
              req = urllib.request.Request(
                  "https://api.mistral.ai/v1" + path,
                  data=json.dumps(payload).encode() if payload else None,
                  method="POST" if payload else "GET",
                  headers={"Authorization": "Bearer " + KEY, "Content-Type": "application/json"})
              try:
                  return json.loads(urllib.request.urlopen(req, timeout=60).read())
              except urllib.error.HTTPError as e:
                  return {"_http": e.code, "_body": e.read().decode()[:200]}
          models = call("/models")
          ids = sorted(m["id"] for m in models.get("data", []))
          print("AVAILABLE_MODELS:", json.dumps(ids))
          for m in ids:
              if any(k in m for k in ("small", "nemo", "devstral", "codestral", "medium")):
                  r = call("/chat/completions", {"model": m,
                      "messages": [{"role": "user", "content": "Reply with exactly: OK"}],
                      "max_tokens": 10})
                  if "_http" in r:
                      print(f"PROBE {m}: HTTP {r['_http']} {r['_body'][:80]}")
                  else:
                      print(f"PROBE {m}: SUCCESS ->", r["choices"][0]["message"]["content"][:20])
          EOF
