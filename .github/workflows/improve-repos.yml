name: Repo Improver Bot

on:
  schedule:
    # Every 2 hours, 24/7 (= 12 runs/day; ~06:00-04:00 IST)
    - cron: "30 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bot repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pytest gmpy2 mpmath

      - name: Run repo improver
        env:
          GH_TOKEN: ${{ secrets.REPO_IMPROVER_TOKEN }}
          LLM_TOKEN: ${{ github.token }}
          LLM_API_KEY: ${{ secrets.LLL_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLL_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLS2_API_KEY: ${{ secrets.LLN2_API_KEY }}
          LLM2_BASE_URL: ${{ vars.LLM2_BASE_URL }}
          LLM2_MODEL: ${{ vars.LLM2_MODEL }}
          LLM3_API_KEY: ${{ secrets.LLS3_API_KEY }}
          LLO3_BASE_URL: ${{ vars.LLO3_BASE_URL }}
          LLO3_MODEL: ${{ vars.LLO3_MODEL }}
          MAX_REPOS_PER_RUN: "2"
        run: python improve_llm.py

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary
          path: run_summary.json
          retention-days: 30
