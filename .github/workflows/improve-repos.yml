name: Repo Improver Bot

on:
  schedule:
    # 5 runs per day, IST business hours (UTC offsets):
    # 09:00 IST = 03:30 UTC
    # 11:00 IST = 05:30 UTC
    # 13:00 IST = 07:30 UTC
    # 15:00 IST = 09:30 UTC
    # 17:00 IST = 11:30 UTC
    - cron: "30 3 * * *"
    - cron: "30 5 * * *"
    - cron: "30 7 * * *"
    - cron: "30 9 * * *"
    - cron: "30 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  models: read

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bot repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests pytest

      - name: Run repo improver
        env:
          GH_TOKEN: ${{ vars.REPO_IMPROVER_TOKEN }}
          LLM_TOKEN: ${{ github.token }}
        run: python improve_llm.py

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary
          path: run_summary.json
          retention-days: 30
