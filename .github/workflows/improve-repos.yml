name: Repo Improver Bot

on:
  schedule:
    # Every 2 hours, 24/7 (12 runs/day)
    - cron: "30 */2 * * *"
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Target a specific repository (e.g. Universal-Parabolic-Constant, Tokamak-Py), or leave empty for auto-selection"
        required: false
        default: ""
      max_repos:
        description: "Maximum number of repos to improve in this run"
        required: false
        default: "2"
      mode:
        description: "Improvement focus: auto | tests | benchmarks | optimize | docs"
        required: false
        default: "auto"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bot repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_IMPROVER_TOKEN || github.token }}
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pytest gmpy2 mpmath numpy

      - name: Run repo improver
        env:
          GH_TOKEN: ${{ secrets.REPO_IMPROVER_TOKEN }}
          PROVIDER_KEYS: ${{ secrets.PROVIDER_KEYS }}
          # Existing providers
          LLM2_API_KEY: ${{ secrets.LLM2_API_KEY }}
          LLM3_API_KEY: ${{ secrets.LLM3_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          # Additional free-tier providers (add the secret to activate each one)
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          GITHUB_MODELS_TOKEN: ${{ secrets.GITHUB_MODELS_TOKEN }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          SAMBANOVA_API_KEY: ${{ secrets.SAMBANOVA_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TOGETHER_API_KEY: ${{ secrets.TOGETHER_API_KEY }}
          LLM7_API_KEY: ${{ secrets.LLM7_API_KEY }}
          OVH_AI_API_KEY: ${{ secrets.OVH_AI_API_KEY }}
          MODELSCOPE_API_KEY: ${{ secrets.MODELSCOPE_API_KEY }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MAX_REPOS_PER_RUN: ${{ inputs.max_repos || '2' }}
          TARGET_REPO: ${{ inputs.target_repo || '' }}
          IMPROVEMENT_MODE: ${{ inputs.mode || 'auto' }}
        run: python improve_llm.py

      - name: Commit state updates & heartbeat
        if: always()
        run: |
          git config user.name "repo-improver-bot[bot]"
          git config user.email "repo-improver-bot@users.noreply.github.com"
          git add -A repo_registry.json LAST_RUN.md || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: update repo registry and keep-alive heartbeat"
            # Rebase AFTER committing: rebasing with unstaged changes present aborts.
            git pull --rebase origin main || git rebase --abort || true
            git push origin main || true
          fi

      - name: Upload run summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-summary
          path: run_summary.json
          retention-days: 30
